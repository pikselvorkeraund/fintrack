name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_DEBUG_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # --- Если есть release-кейстор: подписываем release-APK ---
      - name: Decode Release Keystore
        if: env.HAS_RELEASE_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Release APK
        if: env.HAS_RELEASE_KEY == 'true'
        run: gradle assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # --- Если нет release, но есть фиксированный debug-кейстор: debug-APK с фиксированной подписью ---
      - name: Decode Fixed Debug Keystore
        if: env.HAS_RELEASE_KEY != 'true' && env.HAS_DEBUG_KEY == 'true'
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug-fixed.keystore

      - name: Build Debug APK (fixed key)
        if: env.HAS_RELEASE_KEY != 'true' && env.HAS_DEBUG_KEY == 'true'
        run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        env:
          DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/debug-fixed.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

      # --- Fallback: ни одного кейстора — авто-кейстор раннера ---
      - name: Build Debug APK (auto keystore)
        if: env.HAS_RELEASE_KEY != 'true' && env.HAS_DEBUG_KEY != 'true'
        run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-apk
          path: app/build/outputs/apk/**/*.apk